<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Miền Đông 19</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Miền Đông 19">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0f766e">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
  html,body{margin:0;height:100%;background:#eaf6f3}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0}
  .ld{position:fixed;inset:0;display:grid;place-items:center;font:600 15px system-ui,sans-serif;color:#0b5f57}
  .ld img{width:96px;height:96px;border-radius:22px;display:block;margin:0 auto 12px;box-shadow:0 10px 30px rgba(11,79,108,.25)}
</style>
</head>
<body>
<div class="ld"><div><img src="icon-192.png" alt="">Đang mở Chỉ số sức khỏe MĐ19…</div></div>
<iframe src="https://script.google.com/macros/s/AKfycbwnV2e-6t6fkqtF-Q1X90tvL1bMysSDkQt6Ptow2V-4Y7kI9yYPN7NAfu7RRnMAi0Ro_g/exec" allow="clipboard-read; clipboard-write" title="Miền Đông 19"></iframe>
<script>
// Giữ đăng nhập: app bên trong khung gửi mã phiên ra đây lưu (tên miền này không bị trình duyệt xóa như khung Google)
(function(){
  var K = 'md19_tokens', ok = function(o){ return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/.test(o); };
  function load(){ try{ return JSON.parse(localStorage.getItem(K) || '{}'); }catch(e){ return {}; } }
  window.addEventListener('message', function(e){
    if (!ok(e.origin) || !e.data || !e.data.md19) return;
    var d = e.data, m = load();
    if (d.md19 === 'get'){ e.source.postMessage({ md19: 'tokens', v: m }, e.origin); return; }
    if (d.md19 === 'set' && typeof d.k === 'string' && /^[\w-]{1,80}$/.test(d.k)){
      if (d.v) m[d.k] = String(d.v).slice(0, 100); else delete m[d.k];
      try{ localStorage.setItem(K, JSON.stringify(m)); }catch(x){}
    }
  });
})();
</script>
<script>
// Mất mạng: báo rõ thay vì màn hình trắng, có mạng lại thì tự mở lại app (08/11/2026)
(function(){
  var f = document.querySelector('iframe'), ld = document.querySelector('.ld div'), off = false;
  function down(){ off = true; ld.parentNode.style.zIndex = 2; ld.parentNode.style.background = '#eaf6f3'; ld.innerHTML = '<img src="icon-192.png" alt="">📴 Điện thoại đang mất mạng<br><small style="font-weight:500">App sẽ tự mở lại khi có mạng</small>'; }
  function up(){ if (!off) return; off = false; ld.parentNode.style.zIndex = ''; ld.parentNode.style.background = ''; ld.innerHTML = '<img src="icon-192.png" alt="">Đang mở Chỉ số sức khỏe MĐ19…'; f.src = f.src; }
  window.addEventListener('offline', down); window.addEventListener('online', up);
  if (!navigator.onLine) down();
})();
</script>
</body>
</html>
